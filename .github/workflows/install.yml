name: Install M7A

env:
  MAAFW_VERSION: ""
  MFAA_VERSION: ""

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "**.py"
      - "interface.json"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "**.py"
      - "interface.json"
  workflow_dispatch:

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_release.outputs.is_release }}
      is_prerelease: ${{ steps.set_release.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 设置版本信息
        id: set_tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          fi
      
      - name: 判断是否为发布版本
        id: set_release
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            # 判断是否为预发布版（包含beta, alpha, rc等）
            if [[ "${GITHUB_REF}" =~ (beta|alpha|rc) ]]; then
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  install:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 显示项目结构（调试用）
        run: |
          echo "=== 项目根目录结构 ==="
          ls -la
          echo "=== 查找 interface.json ==="
          find . -name "interface.json" -type f
          echo "=== 查找 assets 目录 ==="
          find . -name "assets" -type d

      - name: Install
        shell: bash
        run: |
          # 创建打包目录
          mkdir -p install
          
          # 1. 复制 MFA 文件（如果存在）
          if [ -d "MFA" ]; then
            echo "Copying MFA files to install directory..."
            rsync -av --ignore-existing MFA/ install/
            echo "MFA files copied successfully."
          else
            echo "MFA directory not found, skipping copy."
          fi
          
          # 2. 复制 interface.json 文件（关键步骤）
          if [ -f "interface.json" ]; then
            echo "Copying interface.json to install directory..."
            cp interface.json install/
            echo "interface.json copied successfully."
            # 验证文件是否复制成功
            if [ -f "install/interface.json" ]; then
              echo "验证：interface.json 已在 install 目录中"
              cat install/interface.json | head -5
            else
              echo "警告：interface.json 复制可能失败"
            fi
          else
            echo "错误：interface.json 不存在于项目根目录！"
            echo "当前目录内容："
            ls -la
          fi
          
          # 3. 显示install目录当前内容
          echo "=== install目录当前内容 ==="
          ls -la install/ || echo "install目录为空"
          
          # 4. 运行Python脚本（如果tools目录存在）
          if [ -d "tools" ]; then
            cd tools/
            
            if command -v python &> /dev/null; then
              echo "Python found, installing dependencies..."
              python -m pip install -r ./requirements.txt || echo "依赖安装失败，继续执行..."
              
              echo "Running install script..."
              # 使用 meta 作业的 tag 输出
              python ./install.py "${{ needs.meta.outputs.tag }}" "windows" "x86_64" || echo "install.py 执行失败"
            else
              echo "Python not found, skipping Python steps"
            fi
            
            cd ..
          else
            echo "tools directory not found, skipping Python steps"
          fi
          
          # 5. 显示最终install目录内容
          echo "=== 最终 install 目录内容 ==="
          find install/ -type f | head -20 || echo "install目录为空"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: M7A-windows-x86_64
          path: "install"
          retention-days: 1

  changelog:
    name: Generate changelog
    needs: meta
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: .github/cliff.toml
        continue-on-error: true

  release:
    name: 发布到 Releases
    needs: [meta, install, changelog]
    if: always() && needs.install.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: M7A-windows-x86_64
          path: release-package

      - name: 验证下载的文件
        run: |
          echo "=== 下载的构建产物 ==="
          ls -la release-package/
          echo "=== 验证 interface.json ==="
          if [ -f "release-package/interface.json" ]; then
            echo "✅ interface.json 存在于构建产物中"
            cat release-package/interface.json | head -3
          else
            echo "❌ 警告：interface.json 不在构建产物中"
            echo "构建产物内容："
            ls -la release-package/
          fi

      - name: 创建并上传到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: "Release ${{ needs.meta.outputs.tag }}"
          body: ${{ needs.changelog.outputs.release_body || '自动构建版本' }}
          files: release-package/*
          draft: false
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
