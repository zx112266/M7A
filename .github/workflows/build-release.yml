name: M7A 自动打包MFAAvalonia
permissions:
  contents: write

env:
  MAAFW_VERSION: ""

on:
  push:
  workflow_dispatch:

jobs:
  build_package:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: win-x86_64
          - os: windows-latest
            name: win-aarch64
    steps:
      - name: 检出本仓库M7A代码
        uses: actions/checkout@v4

      - name: 提取版本号
        id: get_version
        run: |
          if ("${{ github.ref }}" -like "refs/tags/*") {
            $version = "${{ github.ref }}".Replace("refs/tags/", "")
          } else {
            $version = "latest"
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "当前版本号: $version"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install MaaCLI
        shell: bash
        run: |
          winget install MaaWpf.MaaCLI --accept-package-agreements --accept-source-agreements

      - name: MaaCLI Deps
        shell: bash
        run: |
          maa install

      - name: Download MaaFramework Release
        uses: robinraju/release-downloader@v1.12
        with:
          repository: MaaXYZ/MaaFramework
          tag: ${{ env.MAAFW_VERSION }}
          fileName: "MaaFramework-${{ env.MAAFW_VERSION }}-${{ matrix.name }}*"
          out-file-path: framework
          unzip: true

      - name: Download MaaPipelineAssets Release
        uses: robinraju/release-downloader@v1.12
        with:
          repository: MaaXYZ/MaaPipelineAssets
          tag: ${{ env.MAAFW_VERSION }}
          fileName: "MaaPipelineAssets-${{ env.MAAFW_VERSION }}-${{ matrix.name }}*"
          out-file-path: pipeline
          unzip: true

      - name: Download MaaTemplateAssets Release
        uses: robinraju/release-downloader@v1.12
        with:
          repository: MaaXYZ/MaaTemplateAssets
          tag: ${{ env.MAAFW_VERSION }}
          fileName: "MaaTemplateAssets-${{ env.MAAFW_VERSION }}-${{ matrix.name }}*"
          out-file-path: template
          unzip: true

      - name: Generate debug project
        shell: bash
        run: |
          maa init

      - name: Update version
        run: |
          cd ./debug
          sed -i "s/version = .*/version = \"${{ steps.get_version.outputs.version }}\"/" interface.json

      - name: Merge Project Resources and Interface
        shell: bash
        run: |
          cp ./assets/* ./debug/assets/resource/ -r
          cp interface.json ./debug/

      - name: Build MaaTemplateAssets
        shell: bash
        run: |
          cd debug
          maa build
          cd ..

      - name: Compress Windows Distribution
        shell: bash
        run: |
          cd ./debug
          mkdir release
          cp interface.json release/
          cp assets release/ -r
          cp deps release/
          cp install release/
          cp source release/

          cd release

          python3 -c "
          import json
          f = open('assets/pipeline/interface.json', 'r', encoding='utf-8')
          d = json.load(f)
          d['resource'][0]['path'] = ['./assets/resource', '../assets/resource']
          json.dump(d, open('assets/pipeline/interface.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2, sort_keys=True, separators=(',', ':'))
          "

          cd ..
          zip -r "../M7A-${{ steps.get_version.outputs.version }}-${{ matrix.name }}.zip" ./debug/release

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ./M7A-${{ steps.get_version.outputs.version }}-${{ matrix.name }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
