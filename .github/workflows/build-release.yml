name: M7A 自动打包MFAAvalonia
on:
  push:
  workflow_dispatch:

jobs:
  build_package:
    runs-on: windows-latest
    steps:
      - name: 检出本仓库M7A代码
        uses: actions/checkout@v4

      - name: 下载MFAAvalonia最新win‑x64包
        id: download_step
        uses: robinraju/release-downloader@v1
        with:
          repository: MaaXYZ/MFAAvalonia
          latest: true
          filterAssets: "MFAAvalonia-.*-win-x64.zip"
          out-file-path: ./download

      - name: 调试：列出下载目录全部内容
        run: Get-ChildItem ./download -Recurse

      - name: 定位解压出来的程序目录
        id: find_dir
        run: |
          $appDir = Get-ChildItem ./download -Directory | Select-Object -First 1 -ExpandProperty FullName
          echo "app_dir=$appDir" >> $env:GITHUB_OUTPUT

      - name: 复制M7A的assets脚本合并进程序目录
        run: Copy-Item -Path ./assets/* -Destination "${{ steps.find_dir.outputs.app_dir }}/assets/" -Recurse -Force

      - name: 打包输出最终制品
        uses: actions/upload-artifact@v4
        with:
          name: M7A-release-win-x64
          path: ${{ steps.find_dir.outputs.app_dir }}/**
