name: Install M7A

env:
  MAAFW_VERSION: ""
  MFAA_VERSION: ""

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "**.py"
      - "interface.json"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "**.py"
      - "interface.json"
  workflow_dispatch:

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_release.outputs.is_release }}
      is_prerelease: ${{ steps.set_release.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置版本信息
        id: set_tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          fi

      - name: 判断是否为发布版本
        id: set_release
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            if [[ "${GITHUB_REF}" =~ (beta|alpha|rc) ]]; then
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  install:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 显示项目结构（调试用）
        run: |
          echo "=== 项目根目录结构 ==="
          ls -la
          echo "=== 查找 interface.json ==="
          find . -name "interface.json" -type f

      - name: Install
        shell: bash
        run: |
          mkdir -p install
          
          if [ -d "MFA" ]; then
            echo "Copying MFA files to install directory..."
            rsync -av --ignore-existing MFA/ install/
          else
            echo "MFA directory not found, skipping copy."
          fi
          
          if [ -f "interface.json" ]; then
            echo "Copying interface.json to install directory..."
            cp interface.json install/
            echo "interface.json copied successfully."
          else
            echo "interface.json not found, skipping copy."
          fi
          
          echo "=== install目录内容 ==="
          ls -la install/

          if [ -d "tools" ]; then
            cd tools/
            if command -v python &> /dev/null; then
              python -m pip install -r ./requirements.txt || echo "依赖安装失败"
              python ./install.py "${{ needs.meta.outputs.tag }}" "windows" "x86_64" || echo "install.py 执行失败"
            else
              echo "Python not found, skipping"
            fi
            cd ..
          else
            echo "tools directory not found, skipping"
          fi
          
          echo "=== 最终 install 目录内容 ==="
          find install/ -type f | head -30

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: M7A-windows-x86_64
          path: "install"
          retention-days: 1

  changelog:
    name: Generate changelog
    needs: meta
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: .github/cliff.toml
        continue-on-error: true

  release:
    name: 发布到 Releases
    needs: [meta, install, changelog]
    if: always() && needs.install.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: M7A-windows-x86_64
          path: release-package

      - name: 验证构建产物
        run: |
          echo "=== 构建产物内容 ==="
          ls -la release-package/
          if [ -f "release-package/interface.json" ]; then
            echo "✅ interface.json 存在"
          else
            echo "❌ interface.json 不存在"
          fi

      - name: 创建并上传到 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          BODY="${{ needs.changelog.outputs.release_body }}"
          
          # 如果 body 为空，使用默认值
          if [ -z "$BODY" ]; then
            BODY="自动构建版本 $TAG"
          fi

          # 打包为 zip 文件
          cd release-package
          zip -r "../M7A-${TAG}-win-x64.zip" .
          cd ..

          echo "准备创建 Release: $TAG"
          echo "文件列表:"
          ls -la M7A-${TAG}-win-x64.zip

          # 使用 gh CLI 创建 Release
          gh release create "$TAG" \
            "M7A-${TAG}-win-x64.zip" \
            --title "Release $TAG" \
            --notes "$BODY" \
            --repo "$GITHUB_REPOSITORY" \
            ${NEEDS_META_OUTPUTS_IS_PRERELEASE} \
            || echo "gh release create 失败，尝试更新已有 Release..."

          # 如果创建失败（标签已存在），则上传资产到已有 Release
          gh release upload "$TAG" \
            "M7A-${TAG}-win-x64.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            || echo "上传资产失败"
