name: Install M7A

env:
  # - 设置 VERSION 为具体版本号时(如 v1.2.3),下载指定版本
  MAAFW_VERSION: ""
  MFAA_VERSION: ""

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "**.py"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "**.py"
  workflow_dispatch:

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: set_tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          fi

  # 简化：只构建Windows x64版本
  install:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install
        shell: bash
        run: |
          # 创建打包目录
          mkdir -p install
          
          # 复制MFA文件（如果存在）
          if [ -d "MFA" ]; then
            echo "Copying MFA files to install directory..."
            rsync -av --ignore-existing MFA/ install/
            echo "MFA files copied successfully."
          else
            echo "MFA directory not found, skipping copy."
          fi
          
          # 复制 interface.json 文件（你的关键配置）
          if [ -f "interface.json" ]; then
            echo "Copying interface.json to install directory..."
            cp interface.json install/
            echo "interface.json copied successfully."
          else
            echo "interface.json not found, skipping copy."
          fi
          
          # 显示当前目录结构（调试用）
          echo "=== 当前目录结构 ==="
          find . -maxdepth 2 -type f -name "*.py" -o -name "*.json" -o -name "*.txt"
          
          # 检查tools目录是否存在
          if [ -d "tools" ]; then
            cd tools/
            
            # 检查Python是否可用
            if command -v python &> /dev/null; then
              echo "Python found, installing dependencies..."
              python -m pip install -r ./requirements.txt || echo "Failed to install dependencies"
              
              # 运行安装脚本（使用Windows x64参数）
              echo "Running install script for Windows x64..."
              python ./install.py "${{ needs.meta.outputs.tag }}" "windows" "x86_64" || echo "Install script failed"
            else
              echo "Python not found, skipping Python steps"
            fi
            
            cd ..
          else
            echo "tools directory not found, skipping Python steps"
          fi
          
          # 显示install目录内容（调试用）
          echo "=== install目录内容 ==="
          ls -la install/ || echo "install directory is empty"

      - name: Debug - Show install directory
        if: always()
        run: |
          echo "=== 完整目录结构 ==="
          find . -type f | head -50
          echo "=== install目录内容 ==="
          ls -la install/ || echo "install目录不存在或为空"

      - uses: actions/upload-artifact@v4
        with:
          name: M7A-windows-x86_64
          path: "install"

  changelog:
    name: Generate changelog
    needs: meta
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: .github/cliff.toml

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: "Release ${{ needs.meta.outputs.tag }}"
          body: ${{ steps.git-cliff.outputs.content }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mirror:
    needs: [meta, changelog]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger mirror workflow
        shell: bash
        run: |
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release.yml -f tag=${{ needs.meta.outputs.tag }}
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release_note.yml -f tag=${{ needs.meta.outputs.tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
