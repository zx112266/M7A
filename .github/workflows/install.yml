name: M7A 自动打包MFAAvalonia
permissions:
  contents: write
on:
  push:
  workflow_dispatch:
jobs:
  build_package:
    runs-on: windows-latest
    steps:
      - name: 检出本仓库M7A代码
        uses: actions/checkout@v4

      - name: 提取版本号
        id: get_version
        run: |
          if ("${{ github.ref }}" -like "refs/tags/*") {
            $version = "${{ github.ref }}".Replace("refs/tags/", "")
          } else {
            $version = "latest"
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "当前版本号: $version"

      - name: 下载MFAAvalonia最新Windows发行包
        run: |
          New-Item -ItemType Directory -Path ./download -Force
          gh release download --repo MaaXYZ/MFAAvalonia --pattern "*win-x64.zip" --dir ./download
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 解压压缩包
        run: |
          $zipFile = Get-ChildItem ./download/*.zip | Select-Object -First 1
          Expand-Archive -Path $zipFile.FullName -DestinationPath ./app -Force

      - name: 定位程序根目录
        id: find_dir
        run: |
          $appDir = Get-ChildItem ./app -Directory | Select-Object -First 1 -ExpandProperty FullName
          echo "app_dir=$appDir" >> $env:GITHUB_OUTPUT

      - name: 复制M7A的assets脚本到程序目录
        run: |
          $targetPath = "${{ steps.find_dir.outputs.app_dir }}/assets"
          if (-not (Test-Path $targetPath)) {
            New-Item -ItemType Directory -Path $targetPath -Force
          }
          Copy-Item -Path ./assets/* -Destination $targetPath -Recurse -Force

      - name: 复制interface.json到程序根目录
        run: |
           Copy-Item -Path ./interface.json -Destination "${{ steps.find_dir.outputs.app_dir }}" -Force

      - name: 打包为带版本号的zip文件
        run: |
          New-Item -ItemType Directory -Path ./dist -Force
          $fileName = "M7A-${{ steps.get_version.outputs.version }}-win-x64.zip"
          Compress-Archive -Path "${{ steps.find_dir.outputs.app_dir }}/*" -DestinationPath "./dist/$fileName" -Force
          echo "生成文件: $fileName"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: M7A-release-win-x64
          path: ./dist/*.zip

      - name: 发布到仓库 Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
